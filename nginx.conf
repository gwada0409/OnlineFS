server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the AutoID backend container
    location /api/ {
        # Using Docker Compose service name to resolve the backend container.
        # This keeps the /api/ prefix intact since the backend expects /api/[controller]
        proxy_pass http://backend:5000/api/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy SignalR hub connections
    location /hubs/ {
        proxy_pass http://backend:5000/hubs/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
