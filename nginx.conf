# Re-resolve the shared backend after Docker recreates its container.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream autoid_backend {
    zone autoid_backend 64k;
    server backend:5000 resolve;
}

# Deliberately omit query strings, referrers and authorization/cookie headers.
log_format onlinefs_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name localhost;
    access_log /dev/stdout onlinefs_safe;

    # Allow 8 MiB restore chunks and multipart leave attachments.
    client_max_body_size 64m;

    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the AutoID backend container
    location /api/ {
        # Using Docker Compose service name to resolve the backend container.
        # This keeps the /api/ prefix intact since the backend expects /api/[controller]
        proxy_pass http://autoid_backend/api/;
        proxy_read_timeout 300s;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy SignalR hub connections
    location /hubs/ {
        # Nginx error messages cannot redact the SignalR access_token query.
        # Keep connection status in the safe access log and backend diagnostics.
        error_log /dev/null;
        proxy_pass http://autoid_backend/hubs/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 60m;
        proxy_set_header Host $host;
    }
}
